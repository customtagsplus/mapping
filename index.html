<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Paint Tracker Workspace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #111827; color: #fff; font-family: sans-serif; }
        body { display: flex; flex-direction: column; }
        header { background-color: #1f2937; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; z-index: 10; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select, input, button { background-color: #374151; color: #fff; border: 1px solid #4b5563; padding: 6px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; outline: none; }
        #action-btn { background-color: #059669; display: none; }
        #admin-btn { background-color: #d97706; }
        main { flex: 1; display: flex; height: calc(100vh - 70px); position: relative; }
        #map { flex: 1; height: 100%; background-color: #1f2937; }
        .sidebar { width: 280px; background-color: #1f2937; border-left: 1px solid #374151; padding: 15px; overflow-y: auto; }
        .fleet-card { background-color: #111827; padding: 10px; border-radius: 6px; border: 1px solid #374151; margin-top: 10px; }
        .card-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
        #admin-panel { display: none; position: absolute; top: 65px; right: 20px; background-color: #1f2937; border: 1px solid #d97706; padding: 15px; border-radius: 8px; z-index: 99; width: 300px; }
        @media (max-width: 768px) { main { flex-direction: column; } .sidebar { width: 100%; height: 160px; border-left: none; border-top: 1px solid #374151; } }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="font-size: 18px; color: #34d399;">📍 Fleet Paint Tracker</h1>
            <p id="role-badge" style="font-size: 11px; color: #9ca3af;">Viewer / Dashboard Mode</p>
        </div>
        <div class="controls">
            <select id="driver-selector">
                <option value="viewer">🛰️ Dispatcher Dashboard</option>
                <option value="driver_1" id="opt-driver_1">🚗 Driver 1 (Cyan)</option>
                <option value="driver_2" id="opt-driver_2">🚙 Driver 2 (Pink)</option>
                <option value="driver_3" id="opt-driver_3">🚚 Driver 3 (Green)</option>
                <option value="driver_4" id="opt-driver_4">🚛 Driver 4 (Orange)</option>
            </select>
            <button id="action-btn">Start Driving</button>
            <button id="admin-btn">⚙️ Admin</button>
            <button id="share-btn">🔗 Copy Link</button>
        </div>
    </header>

    <div id="admin-panel">
        <h3 style="color: #d97706; margin-bottom: 10px;">Secure Settings</h3>
        <p style="font-size: 12px; color: #9ca3af; margin-bottom: 5px;">Rename Live Driver Profile:</p>
        <div style="display: flex; gap: 5px; margin-bottom: 15px;">
            <select id="admin-driver-pick"><option value="driver_1">Driver 1</option><option value="driver_2">Driver 2</option><option value="driver_3">Driver 3</option><option value="driver_4">Driver 4</option></select>
            <input id="new-name-input" type="text" placeholder="Name" style="width: 100px;">
            <button id="save-name-btn" style="background: #d97706;">Save</button>
        </div>
        <button id="wipe-btn" style="background: #be123c; width: 100%; font-weight: bold; padding: 8px; border: none; border-radius: 4px;">🚨 Wipe Master Fleet Trails</button>
        <button id="close-admin" style="background: none; border: none; width: 100%; margin-top: 10px; font-size: 12px; color: #9ca3af;">Close Panel</button>
    </div>

    <main>
        <div id="map"></div>
        <div class="sidebar">
            <h3 style="font-size: 12px; color: #9ca3af; text-transform: uppercase;">Live Fleet Status</h3>
            <div id="fleet-list"><p id="no-drivers" style="font-size: 13px; color: #4b5563; font-style: italic; margin-top: 10px;">No active drivers.</p></div>
        </div>
    </main>

    <!-- This line pulls the program logic securely from your second file -->
    <script src="tracker-engine.js"></script>
</body>
</html>
