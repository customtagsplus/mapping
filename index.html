<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Paint Tracker Workspace</title>

    <!-- Embedded Native Layout Configurations -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #111827; }
        body {
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #1f2937;
            padding: 1rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .logo-area h1 { font-size: 1.25rem; font-weight: 700; color: #34d399; letter-spacing: 0.05em; }
        .logo-area p { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }
        .controls-area { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
        select, input {
            background-color: #374151;
            color: #ffffff;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            border: 1px solid #4b5563;
            outline: none;
        }
        select:focus, input:focus { border-color: #34d399; }
        button {
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        #action-btn { background-color: #059669; color: white; display: none; }
        #action-btn:hover { background-color: #10b981; }
        #admin-btn { background-color: #d97706; color: white; }
        #admin-btn:hover { background-color: #f59e0b; }
        #share-btn { background-color: #4b5563; color: white; border: 1px solid #6b7280; }
        #share-btn:hover { background-color: #374151; }
        
        main { flex: 1; display: flex; flex-direction: row; height: calc(100vh - 75px); position: relative; }
        #map { flex: 1; height: 100%; background-color: #111827; }
        .sidebar { width: 320px; background-color: #1f2937; border-left: 1px solid #374151; padding: 1rem; overflow-y: auto; }
        .sidebar h3 { font-size: 0.875rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
        .fleet-card { background-color: rgba(17,24,39,0.6); padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #374151; margin-bottom: 0.75rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .card-row { display: flex; justify-content: space-between; font-size: 0.75rem; }
        
        #admin-panel {
            display: none;
            position: absolute;
            top: 5rem;
            right: 1.5rem;
            background-color: rgba(31,41,55,0.98);
            border: 1px solid rgba(217,119,6,0.4);
            padding: 1.25rem;
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            z-index: 30;
            width: 320px;
        }
        .admin-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .admin-head h2 { color: #f59e0b; font-weight: 700; font-size: 1rem; }
        #close-admin { color: #9ca3af; background: none; padding: 0; font-size: 0.75rem; }
        .admin-section-label { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 0.5rem; }
        .wipe-btn-class { width: 100%; background-color: #be123c; color: white; padding: 0.6rem; font-weight: 700; border-radius: 0.5rem; margin-top: 1rem; }
        .wipe-btn-class:hover { background-color: #e11d48; }

        @media (max-width: 768px) {
            main { flex-direction: column; }
            .sidebar { width: 100%; height: 160px; border-left: none; border-top: 1px solid #374151; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>📍 Fleet Paint Tracker</h1>
            <p id="role-badge">Multi-Driver Workspace Dashboard</p>
        </div>
        
        <div class="controls-area">
            <select id="driver-selector">
                <option value="viewer">🛰️ Viewer / Dispatcher Mode</option>
                <option value="driver_1" id="opt-driver_1">🚗 Driver 1 (Neon Cyan)</option>
                <option value="driver_2" id="opt-driver_2">🚙 Driver 2 (Hot Pink)</option>
                <option value="driver_3" id="opt-driver_3">🚚 Driver 3 (Lime Green)</option>
                <option value="driver_4" id="opt-driver_4">🚛 Driver 4 (Bright Orange)</option>
            </select>
            <button id="action-btn">Start Driving</button>
            <button id="admin-btn">⚙️ Admin Panel</button>
            <button id="share-btn">🔗 Copy Link</button>
        </div>
    </header>

    <div id="admin-panel">
        <div class="admin-head">
            <h2>Secure Settings</h2>
            <button id="close-admin">✕ Close</button>
        </div>
        <div>
            <span class="admin-section-label">Rename Live Fleet Profiles</span>
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                <select id="admin-driver-pick" style="flex: 1; padding: 0.25rem;">
                    <option value="driver_1">Driver 1</option>
                    <option value="driver_2">Driver 2</option>
                    <option value="driver_3">Driver 3</option>
                    <option value="driver_4">Driver 4</option>
                </select>
                <input id="new-name-input" type="text" placeholder="New name" style="width: 100px; padding: 0.25rem;">
                <button id="save-name-btn" style="background-color: #d97706; color: white; padding: 0.25rem 0.5rem; border-radius: 0.25rem;">Save</button>
            </div>
        </div>
        <hr style="border-color: #374151;">
        <button id="wipe-btn" class="wipe-btn-class">🚨 Wipe Entire Fleet Trails</button>
    </div>

    <main>
        <div id="map"></div>
        <div class="sidebar">
            <h3>Live Fleet Board</h3>
            <div id="fleet-list">
                <p id="no-drivers-text" style="font-size: 0.875rem; color: #6b7280; font-style: italic;">No active driver feeds detected.</p>
            </div>
        </div>
    </main>
